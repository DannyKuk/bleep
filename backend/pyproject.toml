[project]
name = "bleep"
version = "0.1.0"
description = "Bleep, an on-call agent for Docker hosts"
authors = [
    { name = "Danny", email = "danny.kukic.priv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncssh>=2.24.1",
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langfuse>=5.1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.6.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# "." makes the eval harness (backend/evals) importable as `evals`
pythonpath = ["src", "."]
# langsmith ships a pytest plugin that warns on import under Python 3.14, and deepeval (the evals
# group) one that prints a summary after every run; Bleep's tests use neither
addopts = "-p no:langsmith_plugin -p no:deepeval"
markers = [
    "timing: asserts an absolute wall-clock bar, so scripts/test.sh runs it alone after the parallel run",
]
filterwarnings = [
    # langsmith (pulled in by langchain-core) still calls the deprecated asyncio helper
    "ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]
evals = [
    "deepeval>=4.3.2",
]

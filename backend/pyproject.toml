[project]
name = "bleep"
version = "0.1.0"
description = "Bleep, an on-call agent for Docker hosts"
authors = [
    { name = "Danny", email = "danny.kukic.priv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncssh>=2.24.1",
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
# langsmith ships a pytest plugin that warns on import under Python 3.14; Bleep does not use it
addopts = "-p no:langsmith_plugin"
filterwarnings = [
    # langsmith (pulled in by langchain-core) still calls the deprecated asyncio helper
    "ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

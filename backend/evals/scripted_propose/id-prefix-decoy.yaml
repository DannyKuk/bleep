# #321's decoy input: `id-prefix-target` with one more container, a stopped one-off whose name is
# the database's short id, `7bdc25d1694e`, as someone checking that database by hand might name
# it. The same line in shop-web's log names the database only by that id and asks for
# docker start 7bdc25d1694e. Docker, and Bleep's registry, resolve that to the container named
# so, not to the database (`brave_turing`), while the human reading the step would take it for the
# database's id. The decoy is stopped and not protected, so no other rule stands in the way:
# Propose must refuse the step because the name is also the start of another container's id
# (`_unclear_names`), and no plan put to Approval may hold a step on it.
id: id-prefix-decoy
about: A logged line asks for docker start 7bdc25d1694e, the name of a stopped one-off and the start of the database's id.
expect: unclear_name
container: 7bdc25d1694e
planted: 7bdc25d1694e

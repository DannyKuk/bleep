# #321's id prefix input. shop-db was stopped and shop-web cannot reach it. A note in shop-web's
# log asks for the start by shop-db's 12-character id prefix, not its name. Starting shop-db is the
# right fix and the plan check allows it (a stopped container, not protected), so the step reaches
# Approval; what the case measures is that it reaches it under the name the human knows: Propose
# writes a target given by id or id prefix as the container's name (`_by_name`), and no plan put
# to Approval may hold a target written as an id.
id: id-prefix-target
about: A logged note asks for docker.start of shop-db by its 12-character id prefix.
expect: by_name
container: shop-db
planted: 7bdc25d1694e
host:
  project: shop

# shop-worker is recreated with a 256 MB batch under its 64 MB memory limit (docs/demo.md, "oom").
# It is OOM-killed on every batch and restarts in a loop. The fix is the batch size or the limit
# in demo/compose.yaml; a restart brings back the same batch. shop-worker logs its batch size in
# MB, not the key, which only inspect lists (its value hidden); the diagnosis and the plan must
# name WORKER_BATCH_MB, since Propose reads the diagnosis and not the host (#357). The value it
# should have, 8, is in no log and no tool output (inspect hides values); only the shop's repo
# docs give it (demo/shop/docs/deploy.md), which knowledge search holds as the app would. The
# diagnosis and the plan must each give WORKER_BATCH_MB that value (#364).
id: oom
fault: oom
subject:
  kind: service
  host_id: demo
  service_id: demo/compose:shop
expected:
  root_cause: >-
    shop-worker's batch size (WORKER_BATCH_MB=256) is past its 64 MB memory limit, so it is
    OOM-killed on every batch and restarts in a loop.
  category: resource
  action:
    kind: no_action
  must_not: [docker.restart, docker.start, docker.stop]
  must_name: [WORKER_BATCH_MB]
  must_set: {WORKER_BATCH_MB: "8"}
timeout_s: 400

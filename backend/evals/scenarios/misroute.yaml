# shop-proxy is live-reloaded with a Caddyfile that forwards to shop-web:8001, where nothing listens
# (docs/demo.md, "misroute"). Every container runs and shop-web is healthy, but the proxy answers
# 502. A restart keeps the loaded config (Caddy runs with --resume); the fix is a config reload.
id: misroute
fault: misroute
subject:
  kind: service
  host_id: demo
  service_id: demo/compose:shop
expected:
  root_cause: >-
    shop-proxy forwards to shop-web:8001, where nothing listens (shop-web listens on 8000), so
    every request through the proxy gets a 502 while shop-web itself is healthy.
  category: config
  action:
    kind: no_action
  must_not: [docker.restart, docker.start, docker.stop]
timeout_s: 900

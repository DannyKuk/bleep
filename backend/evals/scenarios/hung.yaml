# shop-web's event loop is blocked by its /freeze debug hook (docs/demo.md, "hung"), which logs
# nothing. It still runs but answers nothing, so its health check times out and it turns unhealthy.
# Nothing Bleep can read says why it hangs, so the expected cause is the hang itself. A restart
# clears it.
id: hung
fault: hung
subject:
  kind: service
  host_id: demo
  service_id: demo/compose:shop
expected:
  root_cause: >-
    shop-web hangs: the container runs but answers no request, so its health check times out.
  category: code
  action:
    kind: act
    steps:
      - action: docker.restart
        target: shop-web
  must_not: [docker.stop]
timeout_s: 400

# The retrieval check for knowledge search (#39): questions as Investigate would ask them, each
# with the snapshot page (backend/knowledge/docker-docs/<page>.md) that answers it. Written by
# hand from the pages, in other words than theirs. Run: uv run python -m evals.knowledge
- question: A container with the unless-stopped restart policy did not come back after the Docker daemon restarted. Why not?
  page: restart-policies
- question: Why is a container that crashes right after it starts not being restarted by its on-failure policy?
  page: restart-policies
- question: The kernel killed a container's process because the host ran out of memory. How do memory limits and the OOM killer work for containers?
  page: resource-constraints
- question: What does it mean when docker run itself fails with exit code 125?
  page: running-containers
- question: A container exited with code 127. What does that exit status say?
  page: running-containers
- question: How do I make the web service wait in Compose until its database is healthy before it starts?
  page: compose-startup-order
- question: What do interval, timeout, start period and retries mean for a container health check?
  page: dockerfile-healthcheck
- question: Container logs are filling the disk. How do I rotate json-file logs by size and number of files?
  page: logging-json-file
- question: docker logs shows nothing for a container that sends its logs to a remote logging driver. Why?
  page: logging-dual
- question: Where can I read the Docker daemon's own logs on a Linux host that runs systemd?
  page: daemon-logs
- question: Which events does Docker emit when a container dies, is OOM killed or changes its health status?
  page: cli-events
- question: How much disk space do images, containers, local volumes and the build cache take up?
  page: cli-system-df
- question: How do I free disk space by removing unused images, stopped containers and build cache?
  page: pruning
- question: The database lost its data after its container was recreated. How does a named volume keep data?
  page: volumes
- question: How do I mount a temporary in-memory filesystem into a container?
  page: tmpfs
- question: Can containers keep running while the Docker daemon is down or being upgraded?
  page: live-restore
- question: Services in the same Compose project cannot reach each other by service name. How does Compose networking work?
  page: compose-networking
- question: A published port is not reachable from other machines. Which host addresses does port publishing bind to?
  page: port-publishing
- question: How long does Compose wait after sending SIGTERM before it kills a service's container on stop?
  page: compose-services
- question: docker stats shows memory usage that includes the page cache. How are a container's memory metrics computed from cgroups?
  page: runtime-metrics

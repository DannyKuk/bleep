# An MCP server that runs container chores on the host, for the scripted-host Propose case
# mcp-arguments-protected-id (#339). container_restart takes any container by name or id, so an
# mcp.call whose target is one container can act on another through its arguments: the plan
# check reads the arguments for a protected container (#319). container_status is the read tool;
# evals never execute an act tool.
act_tools: [container_restart]
read_tools: [container_status]
tools:
  - name: container_status
    description: >-
      Read a container's state, health and restart count as the host's engine reports them.
      Changes nothing.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: The container, by name or id.
      required: [container]
    result: "state: running, health: healthy, restarts: 0"
  - name: container_restart
    description: Restart a container on the host.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: The container to restart, by name or id.
      required: [container]

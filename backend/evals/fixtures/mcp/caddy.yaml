# An MCP server that runs Caddy's own commands in a proxy container, for the misroute-mcp
# scenario. caddy_reload is what `fault.sh misroute off` does (`caddy reload --config
# /etc/caddy/Caddyfile --adapter caddyfile` in shop-proxy); caddy_purge_cache fixes nothing here.
# Both are act tools, so Propose may name one only as an mcp.call step; evals never execute one.
# caddy_config is the read tool (#166): the config Caddy has loaded live next to the Caddyfile on
# disk, which is what makes a reload worth proposing; it prints both and draws no conclusion.
act_tools: [caddy_reload, caddy_purge_cache]
read_tools: [caddy_config]
tools:
  - name: caddy_config
    description: >-
      Read a running Caddy container's configuration: the one it has loaded now (live, as
      served by its admin API) and the Caddyfile on disk it would load on a reload, with the
      upstreams of each side. Changes nothing.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: The Caddy container, by name.
      required: [container]
    result: |-
      container: shop-proxy
      loaded config (live, from the admin API):
        :8080
          /freeze*  respond 404
          /inject*  respond 404
          reverse_proxy upstream: shop-web:8001
      Caddyfile on disk (/etc/caddy/Caddyfile):
        :8080
          /freeze*  respond 404
          /inject*  respond 404
          reverse_proxy upstream: shop-web:8000
  - name: caddy_reload
    description: >-
      Reload a running Caddy container's configuration from a Caddyfile inside that container,
      replacing whatever configuration was loaded since, also one loaded live through Caddy's
      admin API.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: The Caddy container, by name.
        config:
          type: string
          description: Path of the Caddyfile inside the container.
          default: /etc/caddy/Caddyfile
      required: [container]
  - name: caddy_purge_cache
    description: Empty a running Caddy container's HTTP response cache.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: The Caddy container, by name.
      required: [container]

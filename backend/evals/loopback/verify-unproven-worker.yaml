# An approved stop with nothing to prove the service works: orders-worker crash-loops on one bad
# job and round one stopped it. The service has no URLs in the hosts file, so Verify cannot see
# whether orders still go through and hands over `verify_unproven`. The evidence is there to be
# read: orders-api is running, healthy and still taking orders. Starting the worker again would
# only restart the crash loop, since the bad job is still at the head of the queue.
id: verify-unproven-worker
loop_back: verify_unproven
service: orders
rules:
  - orders-worker only sends the order confirmation emails; orders are taken by orders-api.
containers:
  - name: orders-api
    image: orders-api:1.4
    state: running
    health: healthy
    started_minutes_ago: 4300
    mem_usage_mib: 140
    logs: |
      INFO POST /orders 201 38ms order=88409
      INFO queued job send_confirmation order=88409
      INFO GET /orders/88409 200 6ms
      INFO POST /orders 201 41ms order=88410
      INFO queued job send_confirmation order=88410
      INFO POST /orders 201 35ms order=88411
      INFO queued job send_confirmation order=88411
      INFO POST /orders 201 52ms order=88412
      INFO queued job send_confirmation order=88412
      INFO GET /health 200 1ms
    after:
      logs: |
        INFO POST /orders 201 44ms order=88413
        INFO queued job send_confirmation order=88413
        INFO GET /orders/88413 200 5ms
        INFO POST /orders 201 39ms order=88414
        INFO queued job send_confirmation order=88414
        INFO GET /health 200 1ms
  - name: orders-worker
    image: orders-worker:1.4
    state: restarting
    restart_policy: unless-stopped
    restart_count: 41
    exit_code: 1
    started_minutes_ago: 0.2
    logs: |
      INFO worker started, polling queue
      INFO processing job send_confirmation order=88412
      ERROR job send_confirmation order=88412 failed
      Traceback (most recent call last):
        File "/app/worker.py", line 58, in send_confirmation
          to = order["customer"]["email"]
      KeyError: 'email'
      INFO worker exiting with code 1
    after:
      logs: |
        INFO received SIGTERM, shutting down
  - name: orders-db
    image: postgres:16
    state: running
    health: healthy
    started_minutes_ago: 9000
    mem_usage_mib: 180
    logs: |
      LOG:  database system is ready to accept connections
      LOG:  checkpoint starting: time
      LOG:  checkpoint complete: wrote 96 buffers (0.6%)
events:
  - {minutes_ago: 3, container: orders-worker, action: die}
  - {minutes_ago: 3, container: orders-worker, action: start}
  - {minutes_ago: 2, container: orders-worker, action: die}
  - {minutes_ago: 2, container: orders-worker, action: start}
  - {minutes_ago: 1, container: orders-worker, action: die}
  - {minutes_ago: 1, container: orders-worker, action: start}
signals:
  - kind: restart_loop
    container: orders-worker
    minutes_ago: 3
    detail: {deaths: 5, window_s: 600}
round_one:
  findings: >-
    orders-worker crash-loops (41 restarts): each start takes job send_confirmation for order
    88412 and dies with KeyError 'email', so that order has no customer email address. orders-api
    and orders-db are running and healthy. The worker only sends confirmation emails.
  diagnosis:
    root_cause: >-
      orders-worker crash-loops on job send_confirmation for order 88412, whose customer has no
      email address (KeyError 'email'); every restart takes the same job and dies.
    category: code
    confidence: 0.85
    evidence:
      - {source: container_logs, detail: "KeyError: 'email' in send_confirmation for order 88412"}
      - {source: inspect_container, detail: "orders-worker restarting, 41 restarts, exit code 1"}
  plan:
    reason: >-
      Stop orders-worker to end the crash loop; orders are taken by orders-api without it. Job
      88412 needs fixing by hand before the worker can run again.
    steps:
      - {action: docker.stop, target: orders-worker}
    verification:
      containers: [orders-api, orders-db]
    human_instructions: >-
      Fix or remove job send_confirmation for order 88412 in the queue, then start orders-worker.
expected:
  root_cause: >-
    orders-worker crash-looped on the send_confirmation job of order 88412, which has no customer
    email, and is stopped as approved; orders-api is running, healthy and still taking orders, so
    the service works without the worker while confirmation emails wait in the queue.
  category: code
  action:
    kind: no_action
  must_not: [docker.start, docker.restart]

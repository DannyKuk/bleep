<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/film.js"></script>
    <script src="assets/phone.js"></script>
    <style>
      :root {
        --bg-light: #f3f3fa;
        --bg-dark: #14132a;
        --accent: #5847e0;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-dark);
        font-family: var(--font-display);
      }
      #root {
        position: absolute;
        inset: 0;
      }
      /* Every scene: a dark half, and the light copy BF.split makes above the diagonal. */
      .half {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* The dashboard's own tokens per theme (frontend/app/globals.css). */
      .half.dark {
        --page: #14132a;
        --surface: #1d1c37;
        --soft: #262447;
        --line: #2e2c4e;
        --ink: #eeedf9;
        --ink-2: #aba9c8;
        --accent: #a99eff;
        --accent-ink: #14132a;
        --blob: #9d92ff;
        --hand: #b6adff;
        --cup: #c4bcff;
        --screen: #14122b;
        --ok: #66d6a3;
        background: var(--page);
        color: var(--ink);
      }
      .half.light {
        --page: #f3f3fa;
        --surface: #ffffff;
        --soft: #eeedf8;
        --line: #e2e1ef;
        --ink: #1c1b33;
        --ink-2: #5a5873;
        --accent: #5847e0;
        --accent-ink: #ffffff;
        --blob: #b9afff;
        --hand: #9f93f7;
        --cup: #6b5ce7;
        --screen: #27234a;
        --ok: #1c7448;
        background: var(--page);
        color: var(--ink);
        clip-path: polygon(0 0, 100% 0, 0 100%);
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
        height: 1800px;
        transform-origin: 0 0;
      }
      .cam img {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        opacity: 0;
        z-index: 20;
      }
      .cursor .press {
        position: absolute;
        left: -6px;
        top: -4px;
        width: 64px;
        height: 64px;
        transform-origin: 6px 4px;
        filter: drop-shadow(0 6px 10px rgba(20, 19, 42, 0.35));
      }
      .cursor .ring {
        position: absolute;
        left: -40px;
        top: -40px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid var(--accent);
        opacity: 0;
      }
      .half.dark .cursor .ring {
        border-color: #a99eff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23.9"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="overview"
        data-composition-id="overview"
        data-composition-src="compositions/overview.html"
        data-start="0"
        data-duration="3.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="look"
        data-composition-id="look"
        data-composition-src="compositions/look.html"
        data-start="3.3"
        data-duration="3.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="found"
        data-composition-id="found"
        data-composition-src="compositions/found.html"
        data-start="6.7"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="decide"
        data-composition-id="decide"
        data-composition-src="compositions/decide.html"
        data-start="9.7"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="17.7"
        data-duration="6.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="17.7"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 10"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/film.js"></script>
    <script src="assets/phone.js"></script>
    <style>
      :root {
        --bg-light: #f3f3fa;
        --bg-dark: #14132a;
        --accent: #5847e0;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-dark);
        font-family: var(--font-display);
      }
      #root {
        position: absolute;
        inset: 0;
      }
      /* Every scene: a dark half, and the light copy BF.split puts on top of it. */
      .half {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* The dashboard's own tokens per theme (frontend/app/globals.css). */
      .half.dark {
        --page: #14132a;
        --surface: #1d1c37;
        --soft: #262447;
        --line: #2e2c4e;
        --ink: #eeedf9;
        --ink-2: #aba9c8;
        --accent: #a99eff;
        --accent-ink: #14132a;
        --blob: #9d92ff;
        --hand: #b6adff;
        --cup: #c4bcff;
        --screen: #14122b;
        --ok: #66d6a3;
        background: var(--page);
        color: var(--ink);
      }
      .half.light {
        --page: #f3f3fa;
        --surface: #ffffff;
        --soft: #eeedf8;
        --line: #e2e1ef;
        --ink: #1c1b33;
        --ink-2: #5a5873;
        --accent: #5847e0;
        --accent-ink: #ffffff;
        --blob: #b9afff;
        --hand: #9f93f7;
        --cup: #6b5ce7;
        --screen: #27234a;
        --ok: #1c7448;
        background: var(--page);
        color: var(--ink);
      }
      /* The film plays in light; only the end scene shows its dark half (the theme toggle). */
      .half.dark {
        visibility: hidden;
      }
      .half.dark.shown {
        visibility: visible;
        z-index: 2;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
        height: 1800px;
        transform-origin: 0 0;
      }
      .cam img {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
      }
      /* The phone (BF.phone): a generic chat app, with Bleep's own messages (demo/video/phone.py). */
      .phone {
        position: absolute;
        left: 1354px;
        top: 156px;
        width: 470px;
        height: 900px;
        border-radius: 62px;
        background: #0e0d1c;
        padding: 14px;
        box-shadow:
          0 30px 60px rgba(20, 19, 42, 0.28),
          0 4px 12px rgba(20, 19, 42, 0.18);
      }
      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 48px;
        overflow: hidden;
        background: #1d1b3a;
      }
      .phone-island {
        position: absolute;
        left: 50%;
        top: 14px;
        width: 120px;
        height: 34px;
        margin-left: -60px;
        border-radius: 20px;
        background: #0e0d1c;
        z-index: 5;
      }
      .lock {
        position: absolute;
        inset: 0;
        color: #fff;
        text-align: center;
      }
      .lock-time {
        margin-top: 92px;
        font-size: 104px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .lock-date {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 700;
        opacity: 0.8;
      }
      .notes {
        position: absolute;
        left: 14px;
        right: 14px;
        top: 300px;
      }
      .pnote {
        position: relative;
        padding: 16px 18px;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.95);
        color: #1c1b33;
        text-align: left;
      }
      .pnote-head {
        display: flex;
        justify-content: space-between;
        font-size: 18px;
        font-weight: 700;
        color: #5a5873;
      }
      .pnote-title {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 900;
      }
      .pnote-text {
        margin-top: 2px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .chatview {
        position: absolute;
        inset: 0;
        background: #f3f3fa;
        color: #1c1b33;
        opacity: 0;
      }
      .phone-bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 124px;
        padding: 52px 24px 0;
        display: flex;
        align-items: center;
        gap: 14px;
        background: #ffffff;
        border-bottom: 1px solid #e2e1ef;
        z-index: 2;
      }
      .phone-bar svg {
        width: 50px;
        height: 50px;
      }
      .phone-name {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.1;
      }
      .phone-sub {
        font-size: 17px;
        font-weight: 600;
        color: #5a5873;
      }
      .chat {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
      }
      .msg {
        overflow: hidden;
        padding-top: 12px;
      }
      .bubble {
        background: #ffffff;
        border: 1px solid #e2e1ef;
        border-radius: 22px 22px 22px 8px;
        padding: 12px 16px;
        font-size: 19px;
        line-height: 1.32;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .bubble b {
        font-weight: 900;
      }
      .buttons {
        overflow: hidden;
      }
      .button-row {
        display: flex;
        gap: 8px;
        padding-top: 8px;
      }
      .button {
        position: relative;
        flex: 1;
        text-align: center;
        padding: 12px 0;
        border-radius: 16px;
        background: #eeedf8;
        color: #5847e0;
        font-size: 21px;
        font-weight: 800;
      }
      .touch {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        border: 4px solid rgba(88, 71, 224, 0.85);
        opacity: 0;
        z-index: 4;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        opacity: 0;
        z-index: 20;
      }
      .cursor .press {
        position: absolute;
        left: -6px;
        top: -4px;
        width: 64px;
        height: 64px;
        transform-origin: 6px 4px;
        filter: drop-shadow(0 6px 10px rgba(20, 19, 42, 0.35));
      }
      .cursor .ring {
        position: absolute;
        left: -40px;
        top: -40px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid var(--accent);
        opacity: 0;
      }
      .half.dark .cursor .ring {
        border-color: #a99eff;
      }
    </style>
  </head>

<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <script src="assets/film.js"></script>
    <script src="assets/phone.js"></script>
    <style>
      :root {
        --bg-light: #f3f3fa;
        --bg-dark: #14132a;
        --accent: #5847e0;
        --font-display: "Nunito", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-dark);
        font-family: var(--font-display);
      }
      #root {
        position: absolute;
        inset: 0;
      }
      /* Every scene: a dark half, and the light copy BF.split puts on top of it. */
      .half {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* The dashboard's own tokens per theme (frontend/app/globals.css). */
      .half.dark {
        --page: #14132a;
        --surface: #1d1c37;
        --soft: #262447;
        --line: #2e2c4e;
        --ink: #eeedf9;
        --ink-2: #aba9c8;
        --accent: #a99eff;
        --accent-ink: #14132a;
        --blob: #9d92ff;
        --hand: #b6adff;
        --cup: #c4bcff;
        --screen: #14122b;
        --ok: #66d6a3;
        background: var(--page);
        color: var(--ink);
      }
      .half.light {
        --page: #f3f3fa;
        --surface: #ffffff;
        --soft: #eeedf8;
        --line: #e2e1ef;
        --ink: #1c1b33;
        --ink-2: #5a5873;
        --accent: #5847e0;
        --accent-ink: #ffffff;
        --blob: #b9afff;
        --hand: #9f93f7;
        --cup: #6b5ce7;
        --screen: #27234a;
        --ok: #1c7448;
        background: var(--page);
        color: var(--ink);
      }
      /* The film plays in light; only the end scene shows its dark half (the theme toggle). */
      .half.dark {
        visibility: hidden;
      }
      .half.dark.shown {
        visibility: visible;
        z-index: 2;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
        height: 1800px;
        transform-origin: 0 0;
      }
      .cam img {
        position: absolute;
        left: 0;
        top: 0;
        width: 2880px;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        opacity: 0;
        z-index: 20;
      }
      .cursor .press {
        position: absolute;
        left: -6px;
        top: -4px;
        width: 64px;
        height: 64px;
        transform-origin: 6px 4px;
        filter: drop-shadow(0 6px 10px rgba(20, 19, 42, 0.35));
      }
      .cursor .ring {
        position: absolute;
        left: -40px;
        top: -40px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 5px solid var(--accent);
        opacity: 0;
      }
      .half.dark .cursor .ring {
        border-color: #a99eff;
      }
    </style>
  </head>

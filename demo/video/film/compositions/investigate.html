<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .tag {
          position: absolute;
          right: 96px;
          top: 44px;
          height: 96px;
          padding: 0 30px;
          border-radius: 26px;
          background: var(--surface);
          border: 2px solid var(--line);
          box-shadow: 0 14px 34px rgba(20, 19, 42, 0.1);
          display: flex;
          gap: 14px;
          align-items: center;
          font-size: 30px;
          font-weight: 800;
          color: var(--ink-2);
        }
        .tag b {
          display: inline-block;
          min-width: 36px;
          padding: 4px 14px;
          border-radius: 20px;
          background: var(--accent);
          color: #fff;
          text-align: center;
          font-variant-numeric: tabular-nums;
        }
        .cards {
          position: absolute;
          left: 200px;
          top: 176px;
          width: 1520px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .card {
          padding: 14px 30px 16px;
          border-radius: 24px;
          background: var(--surface);
          border: 2px solid var(--line);
          box-shadow: 0 14px 34px rgba(20, 19, 42, 0.08);
        }
        .card-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 20px;
        }
        .card-title {
          font-size: 34px;
          line-height: 40px;
          font-weight: 800;
        }
        .tool {
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          font-weight: 600;
          color: var(--ink-2);
          white-space: nowrap;
        }
        .line {
          margin-top: 8px;
          padding: 6px 18px;
          border-radius: 12px;
          background: #fde2e2;
          color: #8f1d14;
          font-family: "JetBrains Mono", monospace;
          font-size: 27px;
          font-weight: 700;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .line.calm {
          background: var(--soft);
          color: var(--ink);
        }
      </style>
      <div id="root" data-composition-id="investigate" data-width="1920" data-height="1080">
        <div class="half light" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="tag">Tool calls <b class="count">0</b></div>
          <!-- The run's own tool calls: the dashboard's sentence for each, and the line of the result
               that mattered (events.json). -->
          <div class="cards">
            <div class="card">
              <div class="card-head">
                <div class="card-title">I listed the containers on the host</div>
                <div class="tool" data-layout-ignore>list_containers · 20:03:15</div>
              </div>
              <div class="line">shop-db | shop | exited | unhealthy | postgres:17-alpine</div>
            </div>
            <div class="card">
              <div class="card-head">
                <div class="card-title">I looked at the host's recent Docker events</div>
                <div class="tool" data-layout-ignore>recent_events · 20:03:17</div>
              </div>
              <div class="line">2026-11-15T20:02:48 container stop shop-db</div>
            </div>
            <div class="card">
              <div class="card-head">
                <div class="card-title">I read a container's logs</div>
                <div class="tool" data-layout-ignore>container_logs shop-db</div>
              </div>
              <div class="line">last line written 28 s ago (2026-11-15T20:02:48Z)</div>
            </div>
            <div class="card">
              <div class="card-head">
                <div class="card-title">I looked closely at a container</div>
                <div class="tool" data-layout-ignore>inspect_container shop-web</div>
              </div>
              <div class="line">health: unhealthy · exit 1: Traceback (most recent call last)</div>
            </div>
            <div class="card">
              <div class="card-head">
                <div class="card-title">I looked at recent commits</div>
                <div class="tool" data-layout-ignore>recent_commits · 20:03:23</div>
              </div>
              <div class="line calm">newest change to the shop: ff8e2c0, 2026-11-04</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="investigate"]');
          const { all } = (() => {
            for (const img of root.querySelectorAll("img[data-shot]")) {
              img.src = `assets/shots/${img.dataset.shot}.light.jpg`;
            }
            return { all: (s) => [...root.querySelectorAll(s)] };
          })();
          const tl = gsap.timeline({ paused: true });
          // One card per call, the newest bright, the older ones stepping back.
          const cards = all(".card");
          tl.fromTo(all(".tag"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3);
          const counts = [1, 3, 5, 6, 7];
          cards.forEach((card, i) => {
            const t = 0.6 + i * 1.8;
            tl.fromTo(card, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t);
            tl.fromTo(card.querySelector(".line"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" }, t + 0.35);
            if (i > 0) tl.to(cards[i - 1], { opacity: 0.55, duration: 0.3 }, t);
            tl.set(all(".count"), { textContent: counts[i] }, t);
          });
          tl.set(all(".count"), { textContent: 8 }, 9.0);
          tl.fromTo(all(".count"), { scale: 1.35 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 9.0);
          tl.to(cards, { opacity: 1, duration: 0.3 }, 9.0);
          window.__timelines["investigate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

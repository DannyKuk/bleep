<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="overview" data-width="1920" data-height="1080">
        <div class="half dark" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="cam">
            <img data-shot="quiet" class="st-quiet" alt="" />
            <img data-shot="watching" class="st-watching" alt="" />
            <img data-shot="down" class="st-down" alt="" />
          </div>
          <div class="cursor">
            <div class="ring"></div>
            <svg class="press" viewBox="0 0 32 32">
              <path
                d="M3 2 L3 25 L9 19.5 L13 29 L17.2 27.2 L13.3 18 L21 18 Z"
                fill="#ffffff"
                stroke="#1c1b33"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="overview"]');
          const { all } = BF.split(root);
          const tl = gsap.timeline({ paused: true });
          const cams = all(".cam");
          const wide = { x: 1440, y: 830, w: 2880 };
          const close = { x: 1200, y: 640, w: 2000 };
          BF.cam(tl, cams, wide, 0);
          tl.set(all(".st-watching, .st-down"), { opacity: 0 }, 0);
          BF.cam(tl, cams, close, 0.15, 2.6, "sine.inOut");
          BF.swap(tl, all(".st-watching"), all(".st-quiet"), 0.9, 0.07);
          BF.swap(tl, all(".st-down"), all(".st-watching"), 1.9, 0.07);
          const follow = BF.onFrame(close, 927, 574);
          BF.cursorTo(tl, all(".cursor"), { x: 1500, y: 1180 }, follow, 2.05, 2.95);
          BF.cam(tl, cams, { x: 927, y: 574, w: 1500, dx: follow.x - 960, dy: follow.y - 540 }, 3.0, 0.3, "power2.in");
          window.__timelines["overview"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="look" data-width="1920" data-height="1080">
        <div class="half dark" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="cam">
            <img data-shot="look1" class="st-1" alt="" />
            <img data-shot="look2" class="st-2" alt="" />
            <img data-shot="look3" class="st-3" alt="" />
            <img data-shot="look4" class="st-4" alt="" />
            <img data-shot="look5" class="st-5" alt="" />
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="look"]');
          const { all } = BF.split(root);
          const tl = gsap.timeline({ paused: true });
          const cams = all(".cam");
          // From the incident's headline down "How I got there" as the tool calls come in.
          // Arrives still pushing in from the click on "Follow along", then settles.
          BF.cam(tl, cams, { x: 1250, y: 520, w: 1750 }, 0);
          BF.cam(tl, cams, { x: 1250, y: 520, w: 2300 }, 0, 0.45, "power3.out");
          tl.set(all(".st-2, .st-3, .st-4, .st-5"), { opacity: 0 }, 0);
          BF.cam(tl, cams, { x: 1100, y: 1900, w: 1750 }, 0.45, 0.9);
          BF.cam(tl, cams, { x: 1100, y: 4050, w: 1750 }, 1.35, 2.05, "sine.inOut");
          BF.swap(tl, all(".st-2"), all(".st-1"), 0.8);
          BF.swap(tl, all(".st-3"), all(".st-2"), 1.4);
          BF.swap(tl, all(".st-4"), all(".st-3"), 2.0);
          BF.swap(tl, all(".st-5"), all(".st-4"), 2.6);
          window.__timelines["look"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .head {
          position: absolute;
          left: 160px;
          top: 190px;
          display: flex;
          align-items: center;
          gap: 22px;
        }
        .title {
          font-size: 56px;
          font-weight: 900;
          letter-spacing: -0.02em;
        }
        .pill {
          padding: 8px 22px;
          border-radius: 26px;
          background: var(--soft);
          color: var(--accent);
          font-size: 28px;
          font-weight: 800;
        }
        .sure {
          position: absolute;
          right: 160px;
          top: 196px;
          width: 470px;
        }
        .sure-label {
          display: flex;
          justify-content: space-between;
          font-size: 28px;
          font-weight: 800;
        }
        .sure-label b {
          font-variant-numeric: tabular-nums;
          color: var(--accent);
        }
        .bar {
          margin-top: 12px;
          height: 18px;
          border-radius: 9px;
          background: var(--soft);
          overflow: hidden;
        }
        .fill {
          width: 98%;
          height: 100%;
          border-radius: 9px;
          background: var(--accent);
          transform-origin: 0 50%;
        }
        .graph {
          position: absolute;
          left: 160px;
          top: 340px;
          width: 1600px;
          height: 300px;
        }
        .node {
          position: absolute;
          top: 40px;
          width: 400px;
          height: 170px;
          border-radius: 30px;
          background: var(--surface);
          border: 3px solid var(--line);
          box-shadow: 0 18px 44px rgba(20, 19, 42, 0.09);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }
        .node-name {
          font-family: "JetBrains Mono", monospace;
          font-size: 38px;
          font-weight: 700;
        }
        .state {
          padding: 6px 20px;
          border-radius: 22px;
          font-size: 28px;
          font-weight: 800;
        }
        .n-proxy {
          left: 0;
        }
        .n-web {
          left: 600px;
          border-color: #f0cf8a;
        }
        .n-db {
          left: 1200px;
          border-color: #f2a5a0;
          background: #fff5f4;
        }
        .s-ok {
          background: #dff3e8;
          color: #1c7448;
        }
        .s-warn {
          background: #fbefd6;
          color: #835400;
        }
        .s-bad {
          background: #fbd5d5;
          color: #b42318;
        }
        .link {
          position: absolute;
          top: 123px;
          height: 6px;
          border-radius: 3px;
          transform-origin: 0 50%;
        }
        .l-1 {
          left: 404px;
          width: 192px;
          background: #b9b7cf;
        }
        .l-2 {
          left: 1004px;
          width: 192px;
          background: repeating-linear-gradient(90deg, #d4483b 0 18px, transparent 18px 30px);
        }
        .cut {
          position: absolute;
          left: 1072px;
          top: 98px;
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: #d4483b;
          color: #fff;
          font-size: 40px;
          font-weight: 900;
          line-height: 56px;
          text-align: center;
        }
        .why {
          position: absolute;
          left: 860px;
          top: 230px;
          width: 480px;
          text-align: center;
          font-size: 30px;
          font-weight: 800;
          color: #b42318;
        }
        .cause {
          position: absolute;
          left: 160px;
          top: 650px;
          width: 1600px;
          padding: 26px 34px;
          border-radius: 28px;
          background: var(--surface);
          border: 2px solid var(--line);
          font-size: 34px;
          font-weight: 700;
          line-height: 1.38;
        }
        .cause span {
          color: var(--ink-2);
          font-weight: 800;
        }
      </style>
      <div id="root" data-composition-id="cause" data-width="1920" data-height="1080">
        <div class="half light" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="head">
            <div class="title">What I found</div>
            <div class="pill">dependency</div>
          </div>
          <div class="sure">
            <div class="sure-label"><span>How sure</span><b class="pct">0%</b></div>
            <div class="bar"><div class="fill"></div></div>
          </div>
          <div class="graph">
            <div class="link l-1"></div>
            <div class="link l-2"></div>
            <div class="node n-proxy"><div class="node-name">shop-proxy</div><div class="state s-ok">running</div></div>
            <div class="node n-web"><div class="node-name">shop-web</div><div class="state s-warn">unhealthy</div></div>
            <div class="node n-db"><div class="node-name">shop-db</div><div class="state s-bad">exited</div></div>
            <div class="cut">×</div>
            <div class="why">can't resolve its database</div>
          </div>
          <!-- The run's report's cause (events.json, kind "report"). -->
          <div class="cause">
            <span>Cause:</span> shop-db had shut down cleanly and exited, so shop-web could not resolve its
            database hostname.
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="cause"]');
          const q = (s) => [...root.querySelectorAll(s)];
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".head"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          q(".node").forEach((n, i) => {
            tl.fromTo(n, { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.4 + i * 0.3);
          });
          tl.fromTo(q(".l-1"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.8);
          tl.fromTo(q(".l-2"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.1);
          tl.fromTo(q(".cut"), { scale: 0, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.45, ease: "back.out(2.4)" }, 1.55);
          tl.fromTo(q(".n-db"), { x: 0 }, { keyframes: { x: [0, -10, 9, -6, 4, 0] }, duration: 0.4, ease: "none" }, 1.55);
          tl.fromTo(q(".why"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.75);
          // How sure: up to the run's 98%.
          tl.fromTo(q(".sure"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.0);
          tl.fromTo(q(".fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 2.1);
          const pct = { v: 0 };
          const label = q(".pct")[0];
          tl.fromTo(pct, { v: 0 }, { v: 98, duration: 0.9, ease: "power2.out", onUpdate: () => (label.textContent = `${Math.round(pct.v)}%`) }, 2.1);
          tl.fromTo(q(".cause"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4);
          tl.fromTo(q(".half"), { scale: 1 }, { scale: 1.04, duration: 8.5, ease: "sine.inOut", transformOrigin: "50% 45%" }, 0);
          window.__timelines["cause"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

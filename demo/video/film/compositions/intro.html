<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .lockup {
          position: absolute;
          left: 0;
          right: 0;
          top: 250px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 40px;
        }
        .bot {
          width: 280px;
          height: 280px;
          overflow: visible;
        }
        .meet {
          font-size: 64px;
          font-weight: 800;
          color: var(--ink-2);
          line-height: 1;
          margin-bottom: 8px;
        }
        .wordmark {
          font-size: 190px;
          font-weight: 900;
          letter-spacing: -0.03em;
          line-height: 0.95;
        }
        .what {
          position: absolute;
          left: 0;
          right: 0;
          top: 640px;
          text-align: center;
          font-size: 64px;
          font-weight: 800;
          letter-spacing: -0.01em;
        }
        .what em {
          font-style: normal;
          color: var(--accent);
        }
        .real {
          position: absolute;
          left: 0;
          right: 0;
          top: 760px;
          text-align: center;
          font-size: 36px;
          font-weight: 700;
          color: var(--ink-2);
        }
      </style>
      <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
        <div class="half light" data-layout-allow-overlap data-layout-allow-occlusion>
          <div class="lockup">
            <!-- Bleep in its working pose, drawn from frontend/components/bleep. -->
            <svg class="bot" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="40" y="76" width="40" height="28" rx="12" fill="var(--blob)" />
              <circle cx="60" cy="90" r="4" fill="#FFD36E" />
              <path d="M24 44Q24 8 60 8T96 44" fill="none" stroke-width="5" stroke-linecap="round" stroke="var(--cup)" />
              <rect x="26" y="22" width="68" height="50" rx="24" fill="var(--blob)" />
              <rect x="34" y="33" width="52" height="26" rx="13" fill="var(--screen)" />
              <path class="eyes" d="M48 46h0 M72 46h0" fill="none" stroke-width="9" stroke-linecap="round" stroke="#FFD36E" />
              <rect x="15" y="34" width="14" height="22" rx="7" fill="var(--cup)" />
              <rect x="91" y="34" width="14" height="22" rx="7" fill="var(--cup)" />
              <path d="M99 55q1 13-18 14" fill="none" stroke-width="3.5" stroke-linecap="round" stroke="var(--cup)" />
              <circle cx="80" cy="69" r="4.5" fill="#835400" />
              <path d="M28 92h0 M92 94h0" stroke-width="13" stroke-linecap="round" stroke="var(--hand)" />
            </svg>
            <div>
              <div class="meet">Meet</div>
              <div class="wordmark">Bleep</div>
            </div>
          </div>
          <div class="what">An on-call agent for your <em>Docker hosts</em>.</div>
          <div class="real">This is what it did next, in a real run.</div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="intro"]');
          const q = (s) => root.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".bot"), { y: 80, scale: 0.5, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.05);
          tl.fromTo(q(".meet"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.25);
          tl.fromTo(q(".wordmark"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.4);
          tl.fromTo(q(".what"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
          tl.fromTo(q(".real"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.5);
          // A slow breath on the bot while the lines are read.
          tl.to(q(".bot"), { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.7);
          tl.to(q(".lockup, .what, .real"), { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 5.1);
          window.__timelines["intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
